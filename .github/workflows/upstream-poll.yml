name: Upstream poll

# Weekly drift detection for the pinned fastText Common Crawl archives.
# Sends one HEAD request per language, compares ETag/Content-Length against
# scripts/upstream_versions.json, and opens (or updates) one tracking issue
# on drift. Never downloads vectors, never converts, never pushes. Null pins
# are recorded as first observations in the job summary only.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off-peak
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll upstream URLs
        env:
          PIN_FILE: scripts/upstream_versions.json
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["PIN_FILE"], encoding="utf-8") as handle:
              pins = json.load(handle)

          summary = ["## Upstream poll", ""]
          first_lines = []
          drift_lines = []

          for lang in sorted(pins["sources"]):
              info = pins["sources"][lang]
              url = info["url"]
              req = urllib.request.Request(
                  url, method="HEAD",
                  headers={"User-Agent": "models-fasttext-onnx-upstream-poll"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      etag = resp.headers.get("ETag")
                      size = resp.headers.get("Content-Length")
              except Exception as exc:
                  drift_lines.append(
                      f"- {lang}: HEAD request failed ({exc}); verify manually — "
                      f"pinned etag={info['etag']} size={info['size_bytes']}"
                  )
                  continue

              if info["etag"] is None and info["size_bytes"] is None:
                  first_lines.append(
                      f"- {lang}: first observation etag=`{etag}` size={size} "
                      f"(pin file NOT updated; record deliberately)"
                  )
                  continue

              changes = []
              if info["etag"] is not None and info["etag"] != etag:
                  changes.append(f"etag `{info['etag']}` -> `{etag}`")
              if info["size_bytes"] is not None and info["size_bytes"] != int(size):
                  changes.append(f"size {info['size_bytes']} -> {size}")
              if changes:
                  drift_lines.append(f"- {lang}: " + "; ".join(changes))
              else:
                  summary.append(f"- {lang}: unchanged (etag `{etag}`, size {size})")

          if first_lines:
              summary += ["", "### First observations (pins still null)", *first_lines]
          if drift_lines:
              summary += ["", "### Drift detected", *drift_lines]
          else:
              summary += ["", "No drift detected."]

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a",
                    encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")

          if drift_lines:
              with open("drift-report.txt", "w", encoding="utf-8") as handle:
                  handle.write("\n".join(drift_lines) + "\n")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("DRIFT_FOUND=true\n")
          PY
      - name: Open or update drift tracking issue
        if: env.DRIFT_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8').trim();
            const label = 'upstream-drift';
            const title = 'Upstream fastText vectors changed (drift detected)';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'd93f0b',
                description: 'Pinned fastText upstream differs from scripts/upstream_versions.json',
              });
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly upstream poll found differences vs `scripts/upstream_versions.json`.',
              '',
              report,
              '',
              `- Poll run: ${runUrl}`,
              '- This job only reports drift. Re-pinning and reconverting are deliberate human steps.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, labels: label, state: 'open',
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, body,
              });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Poll run ${new Date().toISOString()} still sees drift:\n\n${report}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: [label],
              });
            }
