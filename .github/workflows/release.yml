name: Release

# Tags are pushed only by the owner; this workflow never creates one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # full models come out of LFS as real files for upload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install onnx==1.22.0 onnxruntime==1.23.2 numpy scipy jsonschema
      # Tiers are release-only since the LFS-zero storage model
      # (TODO.deploy/1-2): their training binaries are not in the tree,
      # so the gate validates the CUT instead of rebuilding - registry
      # build at the tag, structural + file validation, and every
      # primary/mirror URL probed at the tag ref.
      - name: Build registry
        run: python scripts/build_registry.py --tag "${{ github.ref_name }}" --strict
      - name: Validate registry
        run: python scripts/validate_registry.py --registry registry.json --check-files
      - name: Validate registry URLs (plan 10 fetchability)
        env:
          URLS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_registry.py --registry registry.json --check-urls --urls-ref "$URLS_REF"
      # Byte-stable snapshot of the committed manifest; regenerating would
      # only churn generated_at.
      - name: Snapshot per-tag manifest
        run: cp manifest.json "manifest-${{ github.ref_name }}.json"
      - name: Generate release notes
        run: python scripts/release_notes.py --registry registry.json > release-notes.md
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            models/**/fasttext.*.onnx
            models/**/fasttext.*.vocab.json
            models/lid/lid.176.onnx
            models/lid/lid.176.vocab.json
            models/typo/typo.biencoder.onnx
            models/typo/typo.biencoder.vocab.json
            registry.json
            manifest-*.json
