name: Daily serving verification

# TODO.deploy/12: the serving surfaces re-verified against the LIVE
# state daily - no push is needed to catch drift (registry, raw
# mirrors, release digests, surgical manifest). A red run is the alert.

on:
  schedule:
    - cron: "23 6 * * *" # daily, deliberately off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install jsonschema urllib3
      - name: Manifest tree parity (surgical manifest vs tree truth)
        run: python3 scripts/check_manifest_tree_parity.py
      - name: Registry URL sweep at main (primaries + raw mirrors)
        run: python3 scripts/validate_registry.py --registry registry.json --check-urls --urls-ref main
      - name: Release asset digest spot check (v1.8.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys, urllib.request

          registry = json.load(open("registry.json"))
          expected = {
              "kotoshu://models/en/mini": "fasttext.en.mini.onnx",
              "kotoshu://models/de/fluency": "fasttext.de.fluency.onnx",
              "kotoshu://models/en/typo-matrix": "typo.matrix.en.ktm1",
          }
          out = subprocess.run(
              ["gh", "api", "repos/kotoshu/models-fasttext-onnx/releases/tags/v1.8.0"],
              capture_output=True, text=True, check=True).stdout
          assets = {a["name"]: (a.get("digest") or "").removeprefix("sha256:")
                    for a in json.loads(out)["assets"]}
          failures = []
          for rid, asset in expected.items():
              want = registry["resources"][rid]["sha256"]
              got = assets.get(asset)
              if got != want:
                  failures.append(f"{asset}: release digest {got} != registry {want}")
          if failures:
              for f in failures:
                  print(f"[FAIL] {f}")
              sys.exit(1)
          print(f"digest spot check OK: {len(expected)} assets match the registry")
          EOF
