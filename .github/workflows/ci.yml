name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python toolchain
        run: python -m pip install -r scripts/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  manifest-drift:
    runs-on: ubuntu-latest
    steps:
      # generate_manifest.rb hashes on-disk .onnx files; they are
      # LFS-tracked, so the checkout needs real bytes, not pointers.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Manifest drift check
        run: |
          cp manifest.json /tmp/manifest.committed.json
          ruby scripts/generate_manifest.rb
          diff -u <(grep -v '"generated_at"' /tmp/manifest.committed.json) \
                  <(grep -v '"generated_at"' manifest.json)
          cp /tmp/manifest.committed.json manifest.json
      - name: Validate registry (schema and ground truth only)
        run: python3 scripts/validate_registry.py --registry registry.json
