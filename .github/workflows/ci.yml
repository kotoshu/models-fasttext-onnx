name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python toolchain
        run: python -m pip install -r scripts/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  manifest-drift:
    runs-on: ubuntu-latest
    steps:
      # Since TODO.deploy/2 the manifest is surgical (full tiers are
      # release-only and never in the tree), so regeneration alone
      # would drop entries. The invariant is tree parity: every
      # tree-present artifact must hash-match the committed manifest.
      - uses: actions/checkout@v4
      - name: Manifest tree-parity check
        run: python3 scripts/check_manifest_tree_parity.py
      - name: Validate registry (schema and ground truth only)
        run: python3 scripts/validate_registry.py --registry registry.json
      - name: Validate registry URLs (plan 10 fetchability)
        env:
          # pull_request ref_name is the synthetic N/merge ref, which the
          # media host does not serve - probe the real head sha instead.
          URLS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/validate_registry.py --registry registry.json --check-urls --urls-ref "$URLS_REF"
