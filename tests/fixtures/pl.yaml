  input:
    word_index: 0
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: -0.000606
      std: 0.096353
      min: -0.3195
      max: 0.8444
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.012761
      std: 0.13043
      min: -0.5501
      max: 1.0454
- name: middle_word
  input:
    word_index: 50000
  expected_output:
    shape:
    - 300
- name: last_word
  input:
    word_index: 99999
