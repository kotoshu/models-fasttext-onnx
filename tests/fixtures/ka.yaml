  input:
    word_index: 0
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: -0.008155
      std: 0.069505
      min: -0.6938
      max: 0.2508
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: -0.006844
      std: 0.07322
      min: -0.7187
      max: 0.3851
- name: middle_word
  input:
    word_index: 50000
