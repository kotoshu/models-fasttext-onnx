      mean: -0.001979
      std: 0.029518
      min: -0.1143
      max: 0.1749
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: -0.002587
      std: 0.029522
      min: -0.1711
      max: 0.1483
- name: middle_word
  input:
    word_index: 50000
