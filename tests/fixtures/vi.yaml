---
metadata:
  language_code: vi
  language_name: VI
  source_model: cc.vi.300.vec
  vocab_size: 100000
  embedding_dim: 300
  onnx_opset: 11
  onnx_ir: 11
model_specifications:
  input:
    name: word_index
    type: int64
    shape:
    - 1
    description: Single word index from vocabulary
  output:
    name: embedding
    type: float32
    shape:
    - 300
    description: 300-dimensional word embedding
validation_rules:
  check_finite: true
  check_shape:
  - 300
  embedding_dim: 300
test_cases:
- name: first_word
  input:
    word_index: 0
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.001782
      std: 0.108215
      min: -0.3586
      max: 1.279
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.004832
      std: 0.148442
      min: -0.341
      max: 1.1907
- name: middle_word
  input:
    word_index: 50000
  expected_output:
    shape:
    - 300
- name: last_word
  input:
    word_index: 99999
  expected_output:
    shape:
    - 300
