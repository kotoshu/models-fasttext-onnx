---
metadata:
  language_code: myv
  language_name: MYV
  source_model: cc.myv.300.vec
  vocab_size: 100000
  embedding_dim: 300
  onnx_opset: 11
  onnx_ir: 11
model_specifications:
  input:
    name: word_index
    type: int64
    shape:
    - 1
    description: Single word index from vocabulary
  output:
    name: embedding
    type: float32
    shape:
    - 300
    description: 300-dimensional word embedding
validation_rules:
  check_finite: true
  check_shape:
  - 300
  embedding_dim: 300
test_cases:
- name: first_word
  input:
    word_index: 0
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.002836
      std: 0.039582
      min: -0.1308
      max: 0.3317
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.000403
      std: 0.050291
      min: -0.3253
      max: 0.3268
- name: middle_word
  input:
    word_index: 50000
  expected_output:
    shape:
    - 300
- name: last_word
  input:
    word_index: 99999
  expected_output:
    shape:
    - 300
