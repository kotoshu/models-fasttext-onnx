    statistics:
      mean: -0.00436
      std: 0.066298
      min: -0.6762
      max: 0.3184
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.000164
      std: 0.032429
      min: -0.3263
      max: 0.1229
- name: middle_word
  input:
    word_index: 50000
