      mean: 0.004818
      std: 0.09939
      min: -0.6247
      max: 0.7993
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.007801
      std: 0.114818
      min: -0.3869
      max: 1.2485
- name: middle_word
  input:
    word_index: 50000
