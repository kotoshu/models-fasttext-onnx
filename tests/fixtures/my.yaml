---
metadata:
  language_code: my
  language_name: MY
  source_model: cc.my.300.vec
  vocab_size: 100000
  embedding_dim: 300
  onnx_opset: 11
  onnx_ir: 11
model_specifications:
  input:
    name: word_index
    type: int64
    shape:
    - 1
    description: Single word index from vocabulary
  output:
    name: embedding
    type: float32
    shape:
    - 300
    description: 300-dimensional word embedding
validation_rules:
  check_finite: true
  check_shape:
  - 300
  embedding_dim: 300
test_cases:
