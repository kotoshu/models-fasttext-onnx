---
metadata:
  language_code: pam
  language_name: PAM
  source_model: cc.pam.300.vec
  vocab_size: 100000
  embedding_dim: 300
  onnx_opset: 11
  onnx_ir: 11
model_specifications:
  input:
    name: word_index
    type: int64
    shape:
    - 1
    description: Single word index from vocabulary
  output:
    name: embedding
    type: float32
    shape:
    - 300
    description: 300-dimensional word embedding
validation_rules:
  check_finite: true
  check_shape:
  - 300
  embedding_dim: 300
test_cases:
- name: first_word
  input:
    word_index: 0
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.001735
      std: 0.046785
      min: -0.2185
      max: 0.1303
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: 0.002473
      std: 0.066935
      min: -0.2041
      max: 0.2216
- name: middle_word
  input:
    word_index: 50000
  expected_output:
    shape:
    - 300
- name: last_word
  input:
    word_index: 99999
  expected_output:
    shape:
    - 300
