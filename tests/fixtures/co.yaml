      mean: -0.000725
      std: 0.041304
      min: -0.1872
      max: 0.1501
- name: second_word
  input:
    word_index: 1
  expected_output:
    shape:
    - 300
    has_statistics: true
    statistics:
      mean: -0.002714
      std: 0.04863
      min: -0.2787
      max: 0.2229
- name: middle_word
  input:
    word_index: 50000
  expected_output:
